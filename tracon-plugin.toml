# hoja as a Tracon plugin (contract 1). The node serves the page from ui/ and
# forwards its api/ requests to `hoja serve --socket <path> --data <dir>`,
# signed as the operator's. hoja takes no credentials and reaches no network.
#
# The tools are the agent API's operations (src/ops.rs), one for one, and hoja
# records the harness the node names as their author. hoja's own gates decide
# what an agent's write does: it lands where the document type lets agents
# write directly, and otherwise becomes a card for the person. So none is
# consequential.
#
# node_methods: hoja raises the cards its tools open in the operator's
# Tracon queue (approval/request, on behalf of the agent's call) and reads
# the decision back (approval/status), deciding the card in hoja as the
# person (src/node_cards.rs). Without the node socket, cards wait in hoja's
# page. The person's own actions (approving,
# deciding cards, marking reviewed, accepting type and template files,
# deleting records) are not tools. Agents may also use the hoja CLI against
# the loopback port `agent_listen` names in <data>/plugin.toml.
#
# PDFs are rendered by the host's Typst compiler, a program hoja runs. Name it
# as `typst` in <data>/plugin.toml, or install it at one of
# /home/linuxbrew/.linuxbrew/bin, /opt/homebrew/bin, /usr/local/bin or
# /usr/bin. Markdown and HTML exports need nothing else.
name = "hoja"
version = "0.4.0"
contract = 1
exec = ["bin/hoja", "serve"]
node_methods = ["approval/request", "approval/status"]

[[tool]]
name = "types"
hint = "read"

[[tool]]
name = "records"
hint = "read"

[[tool]]
name = "record_show"
hint = "read"

[[tool]]
name = "record_create"
hint = "write"

[[tool]]
name = "record_edit"
hint = "write"

[[tool]]
name = "documents"
hint = "read"

[[tool]]
name = "document_show"
hint = "read"

[[tool]]
name = "document_create"
hint = "write"

[[tool]]
name = "document_edit"
hint = "write"

[[tool]]
name = "document_select"
hint = "write"

[[tool]]
name = "document_build"
hint = "write"

[[tool]]
name = "card_status"
hint = "read"

[ui]
entry = "ui/index.html"
title = "hoja"
